# Deploy tools (Field Kit) — dynamic Vue + FastAPI site, internal only.
#
# validate + build run on GitHub-hosted runners (untrusted work stays off the LAN).
# deploy runs on the self-hosted runner inside the LAN and only pulls a pre-built
# image and restarts the container. See docs/PIPELINE.md.
#
# Action versions verified against their releases on 2026-07-24:
#   actions/checkout@v7.0.1            docker/login-action@v4.5.1
#   actions/setup-node@v7.0.0         docker/metadata-action@v6.2.0
#   docker/setup-buildx-action@v4.2.0 docker/build-push-action@v7.3.0
#   aquasecurity/trivy-action@v0.36.0 (keeps the leading 'v')
# Re-verify before bumping — assumed-nonexistent tags were a repeat time-sink.

name: Deploy tools

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # lowercased by metadata-action's output

jobs:
  # ---------- 1. Quality gates (GitHub-hosted) ----------
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # Frontend must build — catches Vue/JS errors before we build the image.
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # Backend must at least import/compile. ubuntu-latest ships python3, so no
      # extra action to pin; the image build is the full dependency check.
      - name: Byte-compile the server
        run: python3 -m compileall -q server

  # ---------- 2. Build & push image (GitHub-hosted) ----------
  build:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.2.0

      - uses: docker/login-action@v4.5.1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # auto-provided

      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/staging' }}
            type=sha,prefix=sha-,format=short

      - uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}  # lowercase, correct ref
          format: table
          severity: HIGH,CRITICAL
          exit-code: '0'      # flip to '1' to fail the build on findings once you're ready

  # ---------- 3. Deploy (self-hosted runner, inside the LAN) ----------
  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: [self-hosted, proxmox, tools]   # the runner INSIDE the tools CT, not web
    steps:
      - name: Resolve target
        id: t
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "service=prod"  >> "$GITHUB_OUTPUT"
            echo "var=PROD_TAG"  >> "$GITHUB_OUTPUT"
            echo "url=https://tools.lan.jacobdreyer.com" >> "$GITHUB_OUTPUT"
          else
            echo "service=stage" >> "$GITHUB_OUTPUT"
            echo "var=STAGE_TAG" >> "$GITHUB_OUTPUT"
            echo "url=https://tools-staging.lan.jacobdreyer.com" >> "$GITHUB_OUTPUT"
          fi

      - name: Pin immutable tag and redeploy
        working-directory: /opt/tools
        run: |
          set -euo pipefail
          TAG="sha-$(echo "${{ github.sha }}" | cut -c1-7)"
          echo "Deploying ${{ steps.t.outputs.service }} -> ${TAG}"
          sed -i "s|^${{ steps.t.outputs.var }}=.*|${{ steps.t.outputs.var }}=${TAG}|" .env
          docker compose pull ${{ steps.t.outputs.service }}
          docker compose up -d --no-deps ${{ steps.t.outputs.service }}
          docker image prune -f

      - name: Smoke test
        run: |
          set -euo pipefail
          for i in $(seq 1 15); do
            if curl -fsSk "${{ steps.t.outputs.url }}/healthz" | grep -q ok; then
              echo "✅ ${{ steps.t.outputs.service }} healthy"; exit 0
            fi
            echo "waiting... ($i/15)"; sleep 4
          done
          echo "❌ health check failed"; exit 1
